<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Esquina de fiesta: serpentinas doradas, confeti, lentejuelas y destellos -->
  <defs>
    <linearGradient id="f" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B8860B"/>
      <stop offset=".3" stop-color="#F5D97A"/>
      <stop offset=".5" stop-color="#D4AF37"/>
      <stop offset=".7" stop-color="#FFF3C4"/>
      <stop offset="1" stop-color="#C9971C"/>
    </linearGradient>
    <radialGradient id="l" cx=".35" cy=".35" r=".7">
      <stop offset="0" stop-color="#FFF8DC"/>
      <stop offset=".45" stop-color="#E9C653"/>
      <stop offset="1" stop-color="#A97A08"/>
    </radialGradient>
    <path id="e" d="M0-10 Q0 0 10 0 Q0 0 0 10 Q0 0 -10 0 Q0 0 0-10Z"/>
  </defs>
  <!-- serpentinas en espiral -->
  <path d="M6 22 C 30 10, 52 30, 40 46 C 30 60, 12 46, 26 36 C 40 26, 66 36, 70 58 C 74 78, 58 92, 76 104" fill="none" stroke="url(#f)" stroke-width="4" stroke-linecap="round"/>
  <path d="M22 4 C 40 14, 62 6, 80 16 C 96 25, 92 42, 106 44 C 122 46, 128 30, 146 34" fill="none" stroke="url(#f)" stroke-width="3" stroke-linecap="round"/>
  <path d="M4 70 C 16 84, 8 100, 20 112 C 30 122, 44 116, 42 132" fill="none" stroke="url(#f)" stroke-width="2.6" stroke-linecap="round"/>
  <!-- confeti -->
  <rect x="96" y="66" width="12" height="5" rx="1.5" fill="url(#f)" transform="rotate(32 102 68)"/>
  <rect x="58" y="120" width="11" height="5" rx="1.5" fill="url(#f)" transform="rotate(-24 63 122)"/>
  <rect x="130" y="12" width="10" height="4" rx="1.5" fill="#fff" stroke="url(#f)" stroke-width="1.4" transform="rotate(18 135 14)"/>
  <rect x="24" y="150" width="10" height="4" rx="1.5" fill="#fff" stroke="url(#f)" stroke-width="1.4" transform="rotate(-40 29 152)"/>
  <rect x="118" y="92" width="9" height="4" rx="1.5" fill="url(#f)" transform="rotate(70 122 94)"/>
  <!-- lentejuelas -->
  <circle cx="88" cy="40" r="7" fill="url(#l)"/>
  <circle cx="52" cy="78" r="5" fill="url(#l)"/>
  <circle cx="140" cy="62" r="4.5" fill="url(#l)"/>
  <circle cx="30" cy="96" r="4" fill="url(#l)"/>
  <circle cx="96" cy="128" r="3.5" fill="url(#l)"/>
  <circle cx="12" cy="134" r="5.5" fill="#fff" stroke="url(#f)" stroke-width="2"/>
  <circle cx="160" cy="30" r="4.5" fill="#fff" stroke="url(#f)" stroke-width="2"/>
  <!-- destellos -->
  <use href="#e" fill="url(#f)" transform="translate(118 30) scale(1.3)"/>
  <use href="#e" fill="url(#f)" transform="translate(74 70) scale(.8)"/>
  <use href="#e" fill="url(#f)" transform="translate(40 172) scale(.9)"/>
  <use href="#e" fill="url(#f)" transform="translate(150 98) scale(.7)"/>
</svg>
